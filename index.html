<!DOCTYPE html>

    <title>Doll Dress Up: Sweet Girl</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000000; }
      #unity-container { position: fixed; inset: 0; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #000000; outline: none; }
      #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; }
      #unity-progress-bar-empty { width: 200px; height: 10px; border-radius: 5px; background: rgba(255, 255, 255, 0.25); overflow: hidden; }
      #unity-progress-bar-full { width: 0%; height: 100%; background: #fff; }
      #unity-warning { position: absolute; left: 50%; top: 5%; transform: translate(-50%); background: white; padding: 10px; display: none; font-family: sans-serif; }
    </style>
  <!-- MSN_PLAY_INJECTED -->
<script src="https://assets.msn.com/staticsb/statics/latest/msstart-games-sdk/msstart-v1.0.0-rc.23.min.js"></script>
<link rel="manifest" href="manifest.json">
</head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Temporary message banner, or a permanent one when type == 'error'.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/4d8641724eaa3e3f372f2959cae3df0f.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/685d7e64540f1a7892126f4b18e5d1e1.data.unityweb",
        frameworkUrl: buildUrl + "/8f68669ae4334900e40f5fbe9b661977.framework.js.unityweb",
        codeUrl: buildUrl + "/0ee72ed417767ca7af4101373d2246d6.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Doll Dress Up: Sweet Girl",
        productVersion: "1.25.1",
        showBanner: unityShowBanner,
      };

      // Lock pinch-zoom gestures (iOS Safari) so the canvas can't be scaled.
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (evt) {
        document.addEventListener(evt, function (e) { e.preventDefault(); }, { passive: false });
      });

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          document.querySelector("#unity-loading-bar").style.display = "none";
        }).catch((message) => {
          unityShowBanner(String(message), 'error');
        });
      };
      document.body.appendChild(script);
    </script>
  <script>

(function () {
  var state = { interstitial: null, rewarded: null, loadingI: false, loadingR: false };
  function sdk() { return (typeof $msstart !== 'undefined' && $msstart) ? $msstart : null; }
  function warn(msg, e) { try { console.warn('[MSN] ' + msg, e || ''); } catch (x) {} }

  function preload(rewarded) {
    var s = sdk();
    var loadingKey = rewarded ? 'loadingR' : 'loadingI';
    var slotKey = rewarded ? 'rewarded' : 'interstitial';
    if (!s || state[loadingKey] || state[slotKey]) return;
    state[loadingKey] = true;
    var p;
    try { p = rewarded ? s.loadAdsAsync(true) : s.loadAdsAsync(); } catch (e) { state[loadingKey] = false; warn('loadAdsAsync threw', e); return; }
    Promise.resolve(p).then(function (ad) { state[slotKey] = ad; })
      .catch(function (e) { warn((rewarded ? 'rewarded' : 'interstitial') + ' load failed', e); })
      .then(function () { state[loadingKey] = false; });
  }

  // Shows a preloaded ad; resolves when it has been fully watched, rejects on error/skip.
  function play(ad) {
    return Promise.resolve(sdk().showAdsAsync(ad.instanceId)).then(function (result) {
      var done = result && result.showAdsCompletedAsync;
      if (typeof done === 'function') done = done.call(result);
      return done;
    });
  }

  function show(rewarded, send, okMethod, failMethod) {
    var slotKey = rewarded ? 'rewarded' : 'interstitial';
    var ad = state[slotKey];
    state[slotKey] = null;
    if (!sdk() || !ad) { preload(rewarded); send(failMethod); return; }
    var finished = false;
    function end(method) {
      if (finished) return;
      finished = true;
      send(method);
      preload(rewarded); // next request must have inventory
    }
    play(ad).then(function () { end(okMethod); })
      .catch(function (e) { warn((rewarded ? 'rewarded' : 'interstitial') + ' show failed', e); end(failMethod); });
  }

  window.LoadInterstitialAd = function () { preload(false); };
  window.LoadRewardedAd = function () { preload(true); };
  window.ShowInterstitialAd = function (send) { show(false, send, 'OnInterstitialComplete', 'OnInterstitialComplete'); };
  window.ShowRewardedAd = function (send) { show(true, send, 'OnRewardedComplete', 'OnRewardedFailed'); };
  window.IsRewardedAdLoaded = function () { return !!state.rewarded; };
  window.MsnNotifyContentLoaded = function () { var s = sdk(); if (s) { try { s.notifyContentLoad(); } catch (e) { warn('notifyContentLoad threw', e); } } };
  window.MsnNotifyGameMuted = function () { var s = sdk(); if (s) { try { s.notifyGameMuted(); } catch (e) {} } };
  window.MsnNotifyGameUnmuted = function () { var s = sdk(); if (s) { try { s.notifyGameUnmuted(); } catch (e) {} } };
})();
</script>
